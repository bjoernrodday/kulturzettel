name: Termine Stadt, Land, Leben holen
on:
  schedule:
    - cron: "17 2 * * *"   # täglich ca. 03:17/04:17 Uhr, vor dem Kulturzettel-Lauf um 05:47
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pipeline/fetch_sll.py, .github/workflows/stadt-land-leben.yml]
permissions:
  contents: write
concurrency:
  group: sll
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_sll.py
      - name: Commit, falls sich etwas geändert hat
        run: |
          git config user.name "Kulturzettel-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/sll.json
          git diff --cached --quiet && exit 0
          git commit -m "Stadt, Land, Leben: Termine $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
