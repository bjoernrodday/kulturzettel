name: Suchmaschinenfassung bauen
on:
  push:
    branches: [main]
    paths:
      - events.json
      - filme.json
      - index.html
      - kino.html
      - quellen.html
      - pipeline/build_seo.py
  schedule:
    - cron: "15 23 * * *"   # kurz nach Mitternacht: vergangene Tage aus den Seiten nehmen
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: suchmaschinen
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python pipeline/build_seo.py
      - name: Commit, falls sich etwas geändert hat
        id: commit
        run: |
          git config user.name "Kulturzettel-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html kino.html quellen.html ueber.html impressum.html datenschutz.html sparte ort sitemap.xml
          git diff --cached --quiet && { echo "neu=0" >> "$GITHUB_OUTPUT"; exit 0; }
          git commit -m "Suchmaschinenfassung $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { echo "neu=1" >> "$GITHUB_OUTPUT"; exit 0; }; sleep 5; done
          exit 1
      - name: Geänderte Seiten an IndexNow melden
        if: steps.commit.outputs.neu == '1'
        run: sleep 120 && python pipeline/indexnow.py
      - name: Bei manuellem Start alle Seiten an IndexNow melden
        if: github.event_name == 'workflow_dispatch'
        run: python pipeline/indexnow.py --alle
