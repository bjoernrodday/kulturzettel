name: Kinoprogramm Cineplex holen
on:
  schedule:
    - cron: "37 2 * * *"   # täglich ca. 03:37/04:37 Uhr, vor dem Kulturzettel-Lauf
  workflow_dispatch:
  push:
    branches: [main]
    paths: [pipeline/fetch_cineplex.py, .github/workflows/cineplex.yml]
permissions:
  contents: write
concurrency:
  group: cineplex
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python pipeline/fetch_cineplex.py
      - name: Commit, falls sich etwas geändert hat
        run: |
          git config user.name "Kulturzettel-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/kino
          git diff --cached --quiet && exit 0
          git commit -m "Kino: Cineplex-Programm $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
