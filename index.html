<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Kulturzettel Bayreuth</title><meta name="description" content="Alle Kulturtermine in Bayreuth für die kommenden zwei Monate – gesammelt aus den Programmen der Häuser."></head><body>

<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: Programmheft – Masthead, Fokus-Strecke, dann Tage als Doppelspalte (große Tagesziffer links, Termine rechts) */
:root{
  --paper:#EDEFF2; --sheet:#F7F8FA; --ink:#14161B; --muted:#5A616C; --rule:#C9CED6;
  --accent:#A8122A; --accent-ink:#FFF7F5; --accent-soft:#F3DADD;
  --display:"Figtree", "Helvetica Neue", Arial, sans-serif;
  --body:"Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gut:clamp(16px,4vw,56px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101216; --sheet:#171A1F; --ink:#ECEDEF; --muted:#99A0AA; --rule:#2B3038;
  --accent:#E04A5E; --accent-ink:#1A0508; --accent-soft:#3A1A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101216; --sheet:#171A1F; --ink:#ECEDEF; --muted:#99A0AA; --rule:#2B3038;
  --accent:#E04A5E; --accent-ink:#1A0508; --accent-soft:#3A1A20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:var(--gut)}

/* Masthead */
.mast{padding-block:28px 22px}
.mast-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font:500 12px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mast-top a{color:inherit;text-underline-offset:3px}
.mast-top a:hover{color:var(--accent)}
.mast h1{font:700 clamp(50px,11vw,160px)/.9 var(--display);letter-spacing:-.04em;margin:18px 0 0}
.mast h1 span{color:var(--accent)}
.mast-sub{display:flex;justify-content:space-between;align-items:end;gap:16px 32px;flex-wrap:wrap;margin-top:14px}
.mast-sub p{margin:0;max-width:34ch;font-size:17px;line-height:1.4}
.intro{display:flex;flex-direction:column;gap:10px}
.mast-sub p.note{max-width:52ch;font-size:12.5px;line-height:1.45;color:var(--muted)}
.stats{display:flex;gap:28px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font:700 32px/1 var(--display);letter-spacing:-.02em}
.stats small{font:500 11px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}

/* Filter */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-block:1px solid var(--ink);margin-top:8px}
.bar-in{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:64px;flex:none}
.chip{border:1px solid var(--rule);background:transparent;padding:5px 11px;border-radius:999px;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .c{font:400 11px var(--mono);opacity:.6;margin-left:4px}
.scroller{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1;padding-block:2px}
@media (max-width:860px){
  .scroller{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;padding-bottom:6px;
    -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .scroller.end{-webkit-mask-image:none;mask-image:none}
  .scroller::-webkit-scrollbar{height:3px}
  .scroller::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;color:var(--ink);min-width:0}
.tools input{flex:1 1 200px}
.tools select{flex:0 1 220px}
.active-tag{display:none}
.active-tag.on{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);border-color:transparent}

/* Laufend */
.running{padding-block:36px 8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.sec-h h2{font:600 26px/1.15 var(--display);letter-spacing:-.01em;margin:0}
.sec-h span{font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.run-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 28px}
.run{padding-block:14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;min-width:0}
.run .span{font:500 11.5px var(--mono);color:var(--accent);letter-spacing:.04em}
.run a{font:600 17px/1.25 var(--display);text-decoration:none}
.run a:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.run .v{font-size:13.5px;color:var(--muted)}
.more{margin-top:14px}

/* Programm */
.prog{padding-block:36px 64px}
.day{display:grid;grid-template-columns:180px minmax(0,1fr);gap:0 36px;border-top:1px solid var(--ink);padding-top:18px;margin-top:36px}
.day-mark{position:sticky;top:calc(env(safe-area-inset-top,0px) + 132px);align-self:start}
.day-mark .n{font:700 96px/.85 var(--display);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.day-mark .w{font:600 20px/1.2 var(--display);margin-top:10px}
.day-mark .m{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.day-mark .today{display:inline-block;margin-top:10px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);padding:2px 7px}
.ev{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:4px 18px;padding-block:18px;border-bottom:1px solid var(--rule)}
.ev:last-child{border-bottom:0}
.ev .t{font:500 14px/1.9 var(--mono);font-variant-numeric:tabular-nums}
.ev .cat{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ev h3{font:600 clamp(19px,2vw,23px)/1.2 var(--display);letter-spacing:-.005em;margin:0;text-wrap:balance}
.ev h3 a{text-decoration:none}
.ev h3 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.ev .sub{font:italic 400 15.5px/1.35 var(--body);color:var(--muted);margin-top:3px}
.ev .desc{margin:8px 0 0;max-width:62ch;font-size:15px}
.ev .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.ev .meta b{font-weight:500;color:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px}
.tag{border:0;background:none;padding:0;font:400 12.5px var(--mono);color:var(--muted);cursor:pointer}
.tag:hover{color:var(--accent)}
.acts{align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.cal{position:relative;font:500 12px var(--mono)}
.cal summary{list-style:none;cursor:pointer;color:var(--muted);padding:2px 4px}
.cal summary::-webkit-details-marker{display:none}
.cal summary:hover,.cal[open] summary{color:var(--accent)}
.cal-menu{position:absolute;right:0;top:calc(100% + 4px);z-index:3;display:flex;flex-direction:column;min-width:170px;background:var(--sheet);border:1px solid var(--ink);padding:4px}
.cal-menu a{padding:7px 10px;text-decoration:none;white-space:nowrap}
.cal-menu a:hover{background:var(--ink);color:var(--paper)}
.ev .link{font:500 12.5px var(--mono);text-decoration:none;border:1px solid var(--ink);padding:6px 10px;white-space:nowrap;border-radius:999px}
.ev .link:hover{background:var(--ink);color:var(--paper)}
.ev.feat h3{color:var(--accent)}
.empty{padding:48px 0;font:500 22px/1.35 var(--display);color:var(--muted)}

footer{border-top:1px solid var(--ink);padding-block:28px 48px;font-size:13.5px;color:var(--muted)}
footer h2{font:600 20px var(--display);color:var(--ink);margin:0 0 10px}
.srcs{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 18px;padding:0;list-style:none}
.srcs a{text-decoration-color:var(--rule);text-underline-offset:3px}
footer p{max-width:70ch;margin:0 0 8px}
footer .legal{margin-top:16px}
footer .legal a{color:var(--ink);text-underline-offset:3px}

.load{padding:40px 0;font:500 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

@media (max-width:860px){
  .day{grid-template-columns:minmax(0,1fr)}
  .day-mark{position:static;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .day-mark .n{font-size:64px}
  .day-mark .w,.day-mark .m,.day-mark .today{margin-top:0}
  .ev{grid-template-columns:52px minmax(0,1fr)}
  .acts{grid-column:2;flex-direction:row;align-items:center;justify-self:start;margin-top:8px;gap:14px}
  .cal-menu{right:auto;left:0}
  .stats{gap:20px}
  .row-label{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .mast h1{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{opacity:.001;transform:translateY(18px)}to{opacity:1;transform:none}}
}
</style>

<header class="wrap mast">
  <div class="mast-top"><span id="issue">Bayreuth</span><span class="mast-r"><span id="upd">ohne Gewähr</span> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></span></div>
  <h1>Kultur<span>zettel</span></h1>
  <div class="mast-sub">
    <div class="intro"><p>Alles, was in Bayreuth auf Bühnen, in Sälen, Museen und Clubs passiert. Gesammelt aus den Programmen der Häuser.</p></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<nav class="bar" aria-label="Filter">
  <div class="wrap bar-in">
    <div class="row"><span class="row-label">Wann</span><div class="scroller" id="f-range"></div></div>
    <div class="row"><span class="row-label">Sparte</span><div class="scroller" id="f-cat"></div></div>
    <div class="row tools">
      <span class="row-label">Wo</span>
      <select id="f-house" aria-label="Spielort"><option value="">Alle Orte</option></select>
      <input id="f-q" type="search" placeholder="Suchen: Titel, Künstlerin, Ort …" aria-label="Suche">
      <button class="chip" id="f-free" aria-pressed="false">Eintritt frei</button>
      <button class="chip active-tag" id="f-tag" aria-label="Schlagwort-Filter entfernen"></button>
    </div>
  </div>
</nav>

<section class="wrap running" id="running" hidden></section>
<main class="wrap prog" id="prog"><div class="load">Programm wird geladen …</div></main>

<footer class="wrap" id="foot"></footer>

<script>
(function(){
const CATS=["Klassik","Oper & Musiktheater","Theater","Tanz","Pop, Rock & Jazz","Club & Party","Kabarett & Comedy","Literatur","Ausstellung","Vortrag & Diskurs","Film","Kinder & Familie","Führung","Festival","Games"];
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MO=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const addD=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)};
const TODAY=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Berlin"});
const dow=s=>parse(s).getUTCDay();
const fmtShort=s=>{const d=parse(s);return d.getUTCDate()+". "+MO[d.getUTCMonth()].slice(0,3)+"."};
const fmtLong=s=>{const d=parse(s);return WD[d.getUTCDay()]+", "+d.getUTCDate()+". "+MO[d.getUTCMonth()]};

function weekend(){const w=dow(TODAY);let s,e;
  if(w===5||w===6||w===0){s=TODAY;e=addD(TODAY,w===0?0:7-w)}else{s=addD(TODAY,5-w);e=addD(s,2)}return[s,e]}
const RANGES=[
  ["heute","Heute",()=>[TODAY,TODAY]],
  ["morgen","Morgen",()=>[addD(TODAY,1),addD(TODAY,1)]],
  ["wochenende","Wochenende",weekend],
  ["woche","7 Tage",()=>[TODAY,addD(TODAY,6)]],
  ["monat","30 Tage",()=>[TODAY,addD(TODAY,29)]],
  ["alle","Alles",()=>[TODAY,"2099-12-31"]]
];
const st={range:"alle",cats:new Set(),house:"",q:"",free:false,tag:""};
let DATA=null;

function isFree(e){return /frei|kostenlos|gratis|0 ?€/i.test((e.price||"")+" "+(e.tags||[]).join(" "))}
function multi(e){return e.end_date&&e.end_date>e.date}
function match(e,ignoreCat){
  if(!ignoreCat&&st.cats.size&&!st.cats.has(e.category))return false;
  if(st.house&&e.house!==st.house)return false;
  if(st.free&&!isFree(e))return false;
  if(st.tag&&!(e.tags||[]).includes(st.tag))return false;
  if(st.q){const h=[e.title,e.subtitle,e.venue,e.organizer,e.description,(e.tags||[]).join(" "),e.category].join(" ").toLowerCase();
    if(!st.q.toLowerCase().split(/\s+/).every(w=>h.includes(w)))return false}
  return true}
function inRange(e,r){const end=e.end_date||e.date;return e.date<=r[1]&&end>=r[0]}

function chipsRange(){$("#f-range").innerHTML=RANGES.map(([k,l])=>`<button class="chip" data-r="${k}" aria-pressed="${st.range===k}">${l}</button>`).join("")}
function chipsCat(){
  const r=RANGES.find(x=>x[0]===st.range)[2]();
  const cnt={};DATA.events.forEach(e=>{if(inRange(e,r)&&match(e,true))cnt[e.category]=(cnt[e.category]||0)+1});
  $("#f-cat").innerHTML=`<button class="chip" data-c="" aria-pressed="${st.cats.size===0}">Alle Sparten</button>`+
    CATS.map(c=>`<button class="chip" data-c="${esc(c)}" aria-pressed="${st.cats.has(c)}">${esc(c)}<span class="c">${cnt[c]||0}</span></button>`).join("")}

function calLink(e,kind){
  const multi=e.end_date&&e.end_date>e.date, timed=e.time&&!multi;
  const pad=n=>String(n).padStart(2,"0");
  const title=e.title+(e.subtitle?" – "+e.subtitle:"");
  const body=(e.description||"")+"\n\n"+e.url+"\n\nAngaben ohne Gewähr – bitte beim Veranstalter prüfen.";
  let sD,eD,sT,eT;
  if(timed){const [h,m]=e.time.split(":").map(Number);sD=e.date;sT=pad(h)+":"+pad(m);
    const end=h+2;eD=end>=24?addD(e.date,1):e.date;eT=pad(end%24)+":"+pad(m)}
  else{sD=e.date;eD=addD(e.end_date||e.date,1)}
  if(kind==="google"){
    const f=(d,t)=>d.replace(/-/g,"")+(t?"T"+t.replace(":","")+"00":"");
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+f(sD,sT)+"/"+f(eD,eT)+(timed?"&ctz=Europe%2FBerlin":"")+"&details="+encodeURIComponent(body)+"&location="+encodeURIComponent(e.venue+", Bayreuth")}
  const o=(d,t)=>d+(t?"T"+t+":00":"");
  return "https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject="+encodeURIComponent(title)+"&startdt="+o(sD,sT)+"&enddt="+o(eD,eT)+"&allday="+(!timed)+"&body="+encodeURIComponent(body)+"&location="+encodeURIComponent(e.venue+", Bayreuth")}
// offene Kalendermenüs schließen, wenn woanders geklickt wird
document.addEventListener("click",ev=>{document.querySelectorAll("details.cal[open]").forEach(d=>{if(!d.contains(ev.target))d.open=false})});
function evHTML(e,feat){
  const tags=(e.tags||[]).slice(0,4).map(t=>`<button class="tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join("");
  const run=multi(e)?`<span>bis ${fmtShort(e.end_date)}</span>`:"";
  return `<article class="ev${feat?" feat":""}">
    <div class="t">${e.time?esc(e.time):"—"}</div>
    <div style="min-width:0">
      <div class="cat">${esc(e.category)}</div>
      <h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></h3>
      ${e.subtitle?`<div class="sub">${esc(e.subtitle)}</div>`:""}
      ${e.description?`<p class="desc">${esc(e.description)}</p>`:""}
      <div class="meta"><b>${esc(e.venue)}</b>${run}${e.price?`<span>${esc(e.price)}</span>`:""}</div>
      ${tags?`<div class="tags">${tags}</div>`:""}
    </div>
    <div class="acts">
      <a class="link" href="${esc(e.url)}" target="_blank" rel="noopener">Zum Termin ↗</a>
      <details class="cal"><summary>+ In den Kalender</summary><div class="cal-menu">
        <a href="${esc(calLink(e,"google"))}" target="_blank" rel="noopener">Google Kalender ↗</a>
        <a href="${esc(calLink(e,"outlook"))}" target="_blank" rel="noopener">Outlook ↗</a>
      </div></details>
    </div>
  </article>`}

let runAll=false;
function render(){
  chipsRange();chipsCat();
  const r=RANGES.find(x=>x[0]===st.range)[2]();
    const evs=DATA.events.filter(e=>inRange(e,r)&&match(e));
  // laufend: mehrtägige Formate, die bereits begonnen haben
  const running=evs.filter(e=>multi(e)&&e.date<=r[0]);
  const dated=evs.filter(e=>!(multi(e)&&e.date<=r[0]));
  const rs=$("#running");
  if(running.length){
    running.sort((a,b)=>a.end_date.localeCompare(b.end_date));
    const show=runAll?running:running.slice(0,9);
    rs.hidden=false;
    rs.innerHTML=`<div class="sec-h"><h2>Laufend &amp; regelmäßig</h2><span>${running.length} Ausstellungen, Reihen, Führungen</span></div>
      <div class="run-grid">${show.map(e=>`<div class="run"><span class="span">${esc(e.category)} · bis ${fmtShort(e.end_date)}</span><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a><span class="v">${esc(e.venue)}</span></div>`).join("")}</div>
      ${running.length>9?`<button class="chip more" id="run-more">${runAll?"Weniger zeigen":"Alle "+running.length+" zeigen"}</button>`:""}`;
  }else rs.hidden=true;
  const days={};dated.forEach(e=>{const k=e.date<r[0]?r[0]:e.date;(days[k]=days[k]||[]).push(e)});
  const keys=Object.keys(days).sort();
  $("#prog").innerHTML=keys.length?keys.map(k=>{const d=parse(k);
    return `<section class="day" aria-label="${fmtLong(k)}"><div class="day-mark"><div class="n">${String(d.getUTCDate()).padStart(2,"0")}</div><div class="w">${WD[d.getUTCDay()]}</div><div class="m">${MO[d.getUTCMonth()]} · ${days[k].length} ${days[k].length===1?"Termin":"Termine"}</div>${k===TODAY?'<span class="today">Heute</span>':k===addD(TODAY,1)?'<span class="today">Morgen</span>':""}</div>
      <div>${days[k].sort((a,b)=>(a.time||"99").localeCompare(b.time||"99")).map(e=>evHTML(e)).join("")}</div></section>`}).join("")
    :`<div class="empty">Für diese Auswahl ist nichts verzeichnet. Probier einen längeren Zeitraum oder eine andere Sparte.</div>`;
  const t=$("#f-tag");t.classList.toggle("on",!!st.tag);t.textContent=st.tag?"#"+st.tag+"  ×":"";
  $("#f-free").setAttribute("aria-pressed",st.free);
}

function head(){
  const evs=DATA.events.filter(e=>(e.end_date||e.date)>=TODAY);
  const houses=new Set(evs.map(e=>e.house));
  const wk=evs.filter(e=>inRange(e,[TODAY,addD(TODAY,6)])).length;
  $("#stats").innerHTML=`<div><b>${evs.length}</b><small>Termine</small></div><div><b>${wk}</b><small>diese Woche</small></div><div><b>${houses.size}</b><small>Spielorte</small></div>`;
  const no=Math.max(1,Math.round((parse(TODAY)-parse("2026-10-03"))/864e5)+1);
  $("#issue").textContent=`Bayreuth · Ausgabe ${no} · ${fmtLong(TODAY)} ${parse(TODAY).getUTCFullYear()}`;
  if(DATA.updated){const u=new Date(DATA.updated);$("#upd").textContent="Stand "+u.toLocaleDateString("de-DE",{day:"numeric",month:"long"})+", "+u.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr"+" · ohne Gewähr"}
  const hs=[...houses].sort((a,b)=>a==="Weitere Orte"?1:b==="Weitere Orte"?-1:a.localeCompare(b,"de"));
  $("#f-house").innerHTML='<option value="">Alle Orte</option>'+hs.map(h=>`<option>${esc(h)}</option>`).join("");
  $("#foot").innerHTML=`<h2>Quellen</h2><ul class="srcs">${(DATA.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join("")}</ul>

  <p class="legal"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a> · Ein privates, nicht-kommerzielles Angebot von Björn Rodday.</p>`}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.r){st.range=b.dataset.r;render()}
  else if(b.dataset.c!==undefined){const c=b.dataset.c;if(!c)st.cats.clear();else st.cats.has(c)?st.cats.delete(c):st.cats.add(c);render()}
  else if(b.dataset.tag){st.tag=b.dataset.tag;render();$("#prog").scrollIntoView({behavior:"smooth"})}
  else if(b.id==="f-tag"){st.tag="";render()}
  else if(b.id==="f-free"){st.free=!st.free;render()}
  else if(b.id==="run-more"){runAll=!runAll;render()}
});
document.querySelectorAll(".scroller").forEach(sc=>{
  const upd=()=>sc.classList.toggle("end",sc.scrollLeft+sc.clientWidth>=sc.scrollWidth-4);
  sc.addEventListener("scroll",upd,{passive:true});new ResizeObserver(upd).observe(sc);
  sc.addEventListener("wheel",ev=>{if(sc.scrollWidth>sc.clientWidth&&Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){sc.scrollLeft+=ev.deltaY;ev.preventDefault();upd()}},{passive:false});
});
$("#f-house").addEventListener("change",e=>{st.house=e.target.value;render()});
let tq;$("#f-q").addEventListener("input",e=>{clearTimeout(tq);tq=setTimeout(()=>{st.q=e.target.value.trim();render()},160)});

fetch("events.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d;head();render()})
.catch(()=>{$("#prog").innerHTML='<div class="empty">Das Programm konnte gerade nicht geladen werden. Bitte die Seite neu laden.</div>'});
})();
</script>
